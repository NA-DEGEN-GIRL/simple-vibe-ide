[package]
name = "simple-vibe-ide"
version = "0.1.0"
description = "Windows-first lightweight bash-grid IDE for WSL and SSH LLM coding."
authors = ["Simple Vibe IDE contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "simple_vibe_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# Optimize the shipped Windows app for runtime responsiveness. This makes
# release builds slower, but keeps the default dev loop unchanged.
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

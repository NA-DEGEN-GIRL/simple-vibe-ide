[package]
name = "simple-vibe-ide"
version = "0.1.0"
description = "Windows-first lightweight bash-grid IDE for WSL and SSH LLM coding."
authors = ["Simple Vibe IDE contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "simple_vibe_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
